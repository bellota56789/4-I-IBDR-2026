<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); max-width: 360px; width: 100%; box-sizing: border-box; }
        h2 { text-align: center; color: #333; margin-top: 0; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { font-size: 14px; color: #666; margin-bottom: 5px; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; width: 100%; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-login:hover { background-color: #0056b3; }
        
        /* Contenedor para los enlaces de abajo */
        .links-container { text-align: center; margin-top: 15px; font-size: 14px; }
        .link-register { color: #28a745; text-decoration: none; font-weight: bold; display: block; margin-bottom: 8px; }
        .link-register:hover { text-decoration: underline; }
        .link-forget { color: #dc3545; text-decoration: none; display: block; }
        .link-forget:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Iniciar Sesión</h2>
    <form action="/login" method="POST">
        <div class="form-group">
            <label>Correo Electrónico:</label>
            <input type="email" name="correo" placeholder="correo@correo.com" required>
        </div>
        <div class="form-group">
            <label>Contraseña:</label>
            <input type="password" name="contrasena" placeholder="Tu contraseña" required>
        </div>
        <button type="submit" class="btn-login">Ingresar</button>
    </form>
    
    <div class="links-container">
        <a href="/register" class="link-register">¿No tienes cuenta? Regístrate aquí</a>
        
        <a href="/forget" class="link-forget">¿Olvidaste tu contraseña?</a>
    </div>
</div>

</body>
</html>
