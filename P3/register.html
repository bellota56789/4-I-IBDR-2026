<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuarios</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .register-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); max-width: 360px; width: 100%; box-sizing: border-box; }
        h2 { text-align: center; color: #333; margin-top: 0; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { font-size: 14px; color: #666; margin-bottom: 5px; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; width: 100%; box-sizing: border-box; }
        .btn-register { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-register:hover { background-color: #218838; }
        .link-login { text-align: center; margin-top: 15px; display: block; color: #007bff; text-decoration: none; font-size: 14px; }
        .link-login:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="register-container">
    <h2>Crear Cuenta</h2>
    <form action="/register" method="POST">
        <div class="form-group">
            <label>Correo Electrónico:</label>
            <input type="email" name="correo" placeholder="ejemplo@correo.com" required>
        </div>
        <div class="form-group">
            <label>Contraseña:</label>
            <input type="password" name="contrasena" placeholder="Crea tu contraseña" required>
        </div>
        <button type="submit" class="btn-register">Registrarse</button>
    </form>
    <a href="/login" class="link-login">¿Ya tienes cuenta? Inicia Sesión</a>
</div>

</body>
</html>
