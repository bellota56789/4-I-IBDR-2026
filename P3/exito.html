<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envío Exitoso</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 10px; box-shadow: 0px 4px 15px rgba(0,0,0,0.08); text-align: center; max-width: 400px; width: 100%; box-sizing: border-box; }
        .icon { font-size: 50px; color: #28a745; margin-bottom: 15px; }
        h2 { color: #333; margin-top: 0; margin-bottom: 10px; font-size: 24px; }
        p { color: #666; font-size: 15px; margin-bottom: 25px; line-height: 1.4; }
        .btn-volver { display: block; padding: 12px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; font-size: 16px; font-weight: bold; transition: background 0.2s; }
        .btn-volver:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="card">
    <div class="icon">✓</div>
    <h2>¡Correo Enviado!</h2>
    <p>La calificación del alumno ha sido localizada y enviada con éxito a su bandeja de entrada.</p>
    <a href="/" class="btn-volver">Volver al Inicio</a>
</div>

</body>
</html>
