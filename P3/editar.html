<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Alumno</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .edit-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); max-width: 480px; width: 100%; box-sizing: border-box; }
        h2 { text-align: center; color: #333; margin-top: 0; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { font-size: 14px; color: #666; margin-bottom: 5px; }
        input, select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; width: 100%; box-sizing: border-box; }
        .btn-save { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-save:hover { background-color: #0056b3; }
        .link-back { text-align: center; margin-top: 15px; display: block; color: #6c757d; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

<div class="edit-container">
    <h2>Editar Alumno</h2>
    
    <form action="/editar/{{alumno[0]}}" method="POST">
        <div class="form-group">
            <label>Nombre:</label>
            <input type="text" name="nombre" value="{{ alumno[1] }}" required>
        </div>
        
        <div class="form-group">
            <label>Correo Electrónico:</label>
            <input type="email" name="correo" value="{{ alumno[2] }}" required>
        </div>
        
        <div class="form-group">
            <label>Calificación:</label>
            <input type="number" step="0.1" name="calificacion" value="{{ alumno[3] }}" min="0" max="10" required>
        </div>
        
        <div class="form-group">
            <label>Grupo Actual: ({{ alumno[4] }})</label>
            <select name="grupo" required>
                <option value="A" {% if alumno[4] == 'A' %}selected{% endif %}>Grupo A</option>
                <option value="B" {% if alumno[4] == 'B' %}selected{% endif %}>Grupo B</option>
                <option value="C" {% if alumno[4] == 'C' %}selected{% endif %}>Grupo C</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Materia Actual: ({{ alumno[5] }})</label>
            <select name="materia" required>
                <option value="Programación" {% if alumno[5] == 'Programación' %}selected{% endif %}>Programación</option>
                <option value="Base de Datos" {% if alumno[5] == 'Base de Datos' %}selected{% endif %}>Base de Datos</option>
                <option value="Matemáticas" {% if alumno[5] == 'Matemáticas' %}selected{% endif %}>Matemáticas</option>
            </select>
        </div>
        
        <button type="submit" class="btn-save">Guardar Cambios</button>
    </form>
    
    <a href="{{ url_for('index') }}" class="link-back">Cancelar y Volver</a>
</div>

</body>
</html>
